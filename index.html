<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parlay Analytics</title>
  <meta name="description" content="Build your parlay like you would on a sportsbook, then track every leg live: scores, clocks, minutes and box score stats across NFL, NBA, college, MLB, NHL, soccer, UFC, tennis, golf and racing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css?v=7">
  <link rel="stylesheet" href="assets/css/drawer.css?v=7">
  <link rel="stylesheet" href="assets/css/pages.css?v=7">
  <script src="assets/js/config.js?v=7"></script>
  <script src="assets/js/site.js?v=7"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container page">
    <div class="page-head reveal">
      <p class="eyebrow">Parlay Analytics</p>
      <h1 class="h-page">Every leg, one screen.</h1>
      <p class="muted">Build your parlay the way you'd place it. Then follow the score, the clock and the box score for every leg without switching apps.</p>
      <div class="head-row">
        <div class="seg" role="tablist" aria-label="View">
          <button type="button" role="tab" data-view-tab="build" aria-selected="true">Build</button>
          <button type="button" role="tab" data-view-tab="track" aria-selected="false">Track <span id="legCount"></span></button>
          <button type="button" role="tab" data-view-tab="teams" aria-selected="false">Teams</button>
        </div>
        <span class="live-pill" id="livePill"><span class="live-dot"></span><span id="liveText">No legs yet</span></span>
        <div class="head-btns">
          <button type="button" class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
          <button type="button" class="btn btn-ghost btn-sm" id="shareBtn" hidden>Share</button>
        </div>
      </div>
    </div>

    <div class="sheet sheet--page">
      <section id="buildView" class="build" aria-label="Build your parlay">
        <div id="board" class="board"></div>
        <aside id="slip" class="slip card" aria-label="Your slip"></aside>
      </section>

      <section id="trackView" aria-label="Track your parlay" hidden>
        <div id="summary" class="summary card" hidden></div>
        <div id="legs" class="legs"></div>
        <div id="trackEmpty" class="track-empty">
          <h2>Nothing to track yet</h2>
          <p class="muted">Add legs in Build. Each one shows up here with its live score, clock and stats.</p>
          <button type="button" class="btn" data-view="build">Build a parlay</button>
        </div>
      </section>

      <section id="teamsView" class="teams" aria-label="Teams, schedules and players" hidden></section>
    </div>
  </main>

  <button type="button" class="slip-bar" id="slipBar" hidden></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/sports.js?v=7"></script>
  <script src="assets/js/app.js?v=7"></script>
</body>
</html>
